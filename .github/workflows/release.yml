name: release
# Run from the Actions tab (or `gh workflow run release`) on main after the version-bump PR is merged.
# CI creates and GPG-signs the tag; the signing key lives only in the RELEASE_GPG_KEY secret.
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - name: Release from main only; tag = package.json version
        run: |
          test "$GITHUB_REF" = refs/heads/main
          echo "TAG=v$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
      - run: npm ci && npm test
      - name: Create and push the GPG-signed tag
        env: { GPG_KEY: "${{ secrets.RELEASE_GPG_KEY }}" }
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then echo "::error::$TAG already exists"; exit 1; fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_KEY" | gpg --batch --quiet --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          git -c user.name=ao3575911 -c user.email=280728713+ao3575911@users.noreply.github.com \
              -c user.signingkey="$fpr" tag -s "$TAG" -m "$TAG"
          gpg --import .github/release-signing-key.asc 2>/dev/null; git tag -v "$TAG"
          git push origin "refs/tags/$TAG"
          rm -rf "$GNUPGHOME"
      - name: Pack and checksum
        run: |
          npm pack
          sha256sum botproof-*.tgz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with: { subject-path: "botproof-*.tgz" }
      - name: GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$TAG" botproof-*.tgz SHA256SUMS --title "$TAG" --notes-file notes.md --verify-tag
      - name: npm publish with provenance (only when NPM_TOKEN is set)
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::notice::NPM_TOKEN not set; skipping npm publish"; exit 0; fi
          npm publish --provenance --access public
